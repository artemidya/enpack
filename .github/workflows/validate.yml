name: Workspace and monitor validation
on:
  push:
    branches: ['arena/4cf01c57-enpack']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test dependencies
        run: python -m pip install -r tools/requirements-test.txt
      - name: Workspace and source tests
        shell: powershell
        run: |
          python tools/test_source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_workspace_icon.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_clean_workspace.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_new_export.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_smartdepart.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_smartdepart_emulated.py deliverables/SmartDepart.cpg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: SmartDepart Windows x64 loader smoke test (no CorelDRAW)
        shell: powershell
        run: ./tools/test_smartdepart_windows.ps1
      - name: PowerShell 5.1 and Win32 smoke tests (no CorelDRAW)
        shell: powershell
        run: ./tools/test_corelwatch_windows.ps1
      - name: CorelWatch 2.0.1 packaged CMD default-launch regression
        shell: powershell
        run: ./tools/test_corelwatch2_launcher_windows.ps1
      - name: CorelWatch 2 synthetic hang and wait-chain tests (no CorelDRAW)
        shell: powershell
        run: ./tools/test_corelwatch2_windows.ps1
